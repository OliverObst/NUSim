# Physics / stepping configuration (module::Simulation)

# Field to play on, overridable with --field <name>. Each field is an MJCF scene, relative to
# mujoco/. The default is the field of the Middle Division the K1 plays in.
field: middle
fields:
  middle: models/k1/k1_scene_robocup_middle.xml # RoboCup 2026 HSL M-Field, 14 x 9 m
  kidsize: models/k1/k1_scene_robocup.xml # RoboCup KidSize (pre-2026 rules), 9 x 6 m
  no-field: models/k1/k1_scene_flat.xml # bare flat floor, no field or ball

# Matches for --game <n> (n robots a side, 1-11), instead of --field/--robots. Positions are one
# team's (x, y) in metres, in its own -x half; the other team is the point-mirror (-x, -y),
# turned to face the other way. The first robot is the main robot -- the one NUbots controls --
# each robot has an independent controller and sensor stream. The dimensions are the field's (HSL M-Field).
game:
  field: middle
  length: 14.0
  width: 9.0
  centre_circle_radius: 1.5
  penalty_mark_distance: 2.0 # from the goal line
  # With --on-field-positions, kickoff positions facing +x, taken in this order as n grows:
  # the attacker (1v1), goalkeeper (2v2), left wing (3v3), right wing (4v4). Robots 5 to 11 are
  # spread evenly through the rest of the half, outside the centre circle.
  attacker: [-2.0, 0.0] # just outside the centre circle
  goalkeeper: [-6.5, 0.0]
  wings: [[-3.0, 2.5], [-3.0, -2.5]]
  # Otherwise the team lines up `sideline_offset` m outside the touchlines facing into the field,
  # two at a time on alternate sides (-y first). Each side starts level with the penalty mark and
  # fills towards the halfway line every `sideline_spacing` m.
  sideline_offset: 0.3
  sideline_spacing: 0.8

real_time_factor: 1.0 # 0 = free-run (tests/training)
state_publish_divisor: 20 # physics steps per SimStateUpdate (1 kHz / 20 = 50 Hz LowState)
resync_threshold: 0.05 # seconds behind schedule before the pacing deadline resyncs

# Ground-contact override for the "floor" geom.
#
# WITH enabled: false (the default) the feet do NOT see the floor's declared friction. The
# K1 foot box geom declares none, so it takes MuJoCo's default of 1.0; the robocup floor
# declares 0.8; equal geom priorities mean MuJoCo uses the element-wise MAX, so every NUSim
# run to date has simulated mu = 1.0 -- grippier than the scene claims, and grippier than
# any surface the robot actually stands on. Turning this on raises the floor's priority to
# 1 so its numbers govern the contact, which is what the training scene does.
#
# This is the knob for the one confirmed hardware variable: the same policy at the same
# commanded velocity is stable on carpet and progressively falls on the synthetic-grass
# field. Measure mu on both with a tilt test (mu = tan(slip angle)) and record them in
# benchmarks/surfaces.md; until then, run the corners the walk policy is trained over:
#
#   friction: 0.25   # slidey turf  (a loaded foot slips at 14.0 deg)
#   friction: 1.2    # grippy felt  (slips at 50.2 deg)
#
# solref_timeconst is contact softness (rigid ground is small), clamped up to 2 * model
# timestep for solver stability. Training randomises it over [0.006, 0.03].
surface:
  enabled: false
  friction: 0.8
  solref_timeconst: 0.02
  solref_dampratio: 1.0

# Per-foot contact CSV, written at the state publish rate (50 Hz). Empty = off.
# Columns: t, per foot {normal force, centre of pressure x/y in the foot frame, sole
# pitch/roll}, base pitch, base height. The sole box spans x in [-0.064, +0.116] of the
# foot frame, so flat-footed stance sits near cop_x = 0.026 and a foot up on its toe
# drives cop_x towards +0.116 -- that is the tiptoe measurement.
foot_log: ""
